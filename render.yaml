# Deploy gratuito su Render (https://render.com) — vedi docs/deploy.md
# Un solo servizio: il backend espone le API e serve la web app React compilata (stesso dominio HTTPS).
services:
  - type: web
    name: regen-luxury
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BLOCKCHAIN_MODE
        value: polygon
      - key: POLYGON_RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: CHAIN_NAME
        value: polygon-amoy
      - key: CONTRACT_ADDRESS
        sync: false
      - key: PLATFORM_PRIVATE_KEY
        sync: false
